name: sos_emergency
description: "Static demo: an SOS button that triggers a loud alarm which bypasses silent mode."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # --- State management (BLoC) ---
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # --- Loud alarm that bypasses silent mode (the heart of the demo) ---
  flutter_local_notifications: ^22.0.1  # full-screen-intent notification (lock screen)
  audioplayers: ^6.1.0                  # play siren on the ALARM audio stream
  vibration: ^3.2.0                     # buzz alongside the siren
  wakelock_plus: ^1.2.8                 # keep screen awake while alarm rings

  # --- Local persistence for the mock contact list ---
  shared_preferences: ^2.3.2

  # --- Home-screen button widget / shortcut ---
  home_widget: ^0.9.3           # native home-screen widget (Android + iOS)

  # --- Runtime permission prompts (notifications / fullscreen-intent) ---
  permission_handler: ^11.3.1

  # --- Current location for the emergency SMS ---
  geolocator: ^13.0.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  google_fonts: ^8.2.1
  flutter_contacts: ">=1.1.0 <2.0.0"
  http: ^1.3.0

  # --- Detect whether we have a network before attempting the ring push ---
  connectivity_plus: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icons/
    - assets/images/
